baseurl = "https://blog.tomecek.net/"
locale = "en-us"
title = "Blog | Tomáš Tomeček"
rssLimit = 7

[services.googleAnalytics]
id = "G-J1S1CFZG1B"

[pagination]
  pagerSize = 7

[markup]
  # Code is highlighted at build time by Chroma. The colours are in
  # assets/css/code.css, see CLAUDE.md for how to change the style.
  [markup.highlight]
    noClasses = false
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[taxonomies]
  tag = "tags"

[params]
  name = "Tomáš Tomeček"
  tagline = "tall software engineer"
  bio = "Tall software engineer, teacher, speaker, coder, linux enthusiast, gardener, hiker."
  description = "Technical blog. Read about Linux, Python, Containers, Red Hat, Fedora, tools."
  location = "Brno, Czech Republic"
  twitter = "TomasTomec"
  github = "TomasTomecek"
[params.author]
  name = 'Tomas Tomecek'

# The top navbar. RSS is added by the template.
[[menus.main]]
  name = "Home"
  pageRef = "/"
  weight = 1
[[menus.main]]
  name = "Articles"
  pageRef = "/articles"
  weight = 2
[[menus.main]]
  name = "Tags"
  pageRef = "/tags"
  weight = 3
[[menus.main]]
  name = "About"
  pageRef = "/about"
  weight = 4
