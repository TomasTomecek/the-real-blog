{{ define "main" }}
<h1 class="page-title">{{ .Title }}</h1>
{{ range (where .Site.RegularPages "Type" "post").GroupByDate "2006" }}
<section class="year">
  <h2>{{ .Key }} <small>{{ len .Pages }}</small></h2>
  <ul class="rows">
    {{ range .Pages }}<li><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "Jan 02" }}</time><a href="{{ .RelPermalink }}">{{ .Title }}</a></li>{{ end }}
  </ul>
</section>
{{ end }}
{{ end }}
